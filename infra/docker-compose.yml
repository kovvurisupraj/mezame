# Anime Tracker — Local Development Stack
#
# Default (infra only — recommended for daily dev):
#   docker compose up postgres redis qdrant -d
#   Then run web and ai-service natively for hot reload.
#
# Full stack in Docker (for integration testing):
#   docker compose --profile full up
#
# With observability:
#   docker compose --profile full --profile observe up

services:

  # ─── Data Services (always started) ────────────────────────────

  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB:       animetracker
      POSTGRES_USER:     dev
      POSTGRES_PASSWORD: dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:     ["CMD-SHELL", "pg_isready -U dev -d animetracker"]
      interval: 5s
      timeout:  5s
      retries:  5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test:     ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout:  3s
      retries:  5

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"   # HTTP API + dashboard
      - "6334:6334"   # gRPC
    volumes:
      - qdrantdata:/qdrant/storage
    healthcheck:
      test:     ["CMD-SHELL", "wget -q --spider http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout:  5s
      retries:  5

  # ─── Applications (--profile full) ─────────────────────────────

  web:
    profiles: ["full"]
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      target: development
    ports:
      - "3000:3000"
    env_file:
      - ../.env.local
    environment:
      NODE_ENV: development
    volumes:
      - ../apps/web:/app/apps/web
      - ../packages:/app/packages
      - web_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ai-service:
    profiles: ["full"]
    build:
      context: ../apps/ai-service
      dockerfile: Dockerfile
      target: development
    ports:
      - "8000:8000"
    env_file:
      - ../.env.local
    environment:
      ENVIRONMENT: development
    volumes:
      - ../apps/ai-service:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  # ─── Observability (--profile observe) ─────────────────────────
  # Added in Phase 8 — run with: docker compose --profile observe up

  langfuse:
    profiles: ["observe"]
    image: langfuse/langfuse:latest
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL:     "postgresql://dev:dev@postgres:5432/langfuse"
      NEXTAUTH_SECRET:  "local-dev-secret-replace-in-production"
      NEXTAUTH_URL:     "http://localhost:3001"
      SALT:             "local-dev-salt-replace-in-production"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  qdrantdata:
  web_modules:
